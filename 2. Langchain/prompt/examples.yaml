# 공공데이터 개방 제외 사유 작성 예시 (20개)
# 테이블명, 코드, 컬럼과 사유는 본 대화에서 검토한 사례를 바탕으로 정리했다.
# columns는 실제 컬럼 중 참고용으로 선택한 일부 항목이며 전체 스키마를 뜻하지 않는다.
# 예시는 문체·문장 길이·테이블 분류를 참고하기 위한 것으로, 정답이나 법적 비공개 근거가 아니다.
# 예시의 6호/9호 비율을 새로운 테이블의 코드 선정 확률로 사용하지 않는다.
# review_required: true는 실제 데이터 또는 비공개 적합성에 대한 확인이 필요함을 의미한다.
# Python 입력 변수는 여전히 table_name, columns_df 두 개이며 examples.yaml은 내부 참조자료다.
examples:
- table_name: 개인정보수집관리
  category: 개인정보 및 등록자 식별정보
  exclusion_code: '6'
  columns:
  - 개인정보수집내용
  - 개인정보수집명
  - 등록자아이디
  - 등록자IP주소
  - 시스템아이디
  exclusion_reason: >-
    개인정보수집내용, 등록자아이디, 등록자IP주소 등 개인정보 수집 관련 항목과 개인 식별에 활용될 수 있는 정보가 함께 관리되고 있어 개인정보 보호를 위해 개방에서 제외
  review_required: true
  review_comment: 개인정보수집내용에 실제 개인정보가 저장되는지는 알 수 없으므로 확인 필요. 등록자 식별정보를 근거로 6호를 우선 검토함.
- table_name: 개인정보처리 방침관리
  category: 담당자 및 책임자 정보
  exclusion_code: '6'
  columns:
  - 담당자명
  - 담당자이메일주소
  - 책임자명
  - 책임자전화번호
  - 등록자아이디
  - 편집기내용
  exclusion_reason: >-
    담당자명, 담당자이메일주소, 등록자아이디 등 개인과 연결되는 정보가 방침 관리 항목과 함께 저장되어 있어, 업무 담당 내역과 결합한 개인 식별 가능성을 고려하여 개방에서 제외
  review_required: true
  review_comment: 개인 식별 관련 컬럼이 있어 6호를 검토함. 공식적으로 공개되는 담당자 연락처와 내부 관리정보는 구분해야 함.
- table_name: 개인정보수집관리 HIST
  category: 개인정보 및 이력관리
  exclusion_code: '9'
  columns:
  - 이력일련번호
  - 개인정보수집내용
  - 개인정보수집명
  - 등록자아이디
  - 등록자IP주소
  exclusion_reason: >-
    개인정보수집내용, 이력일련번호, 등록자아이디 등 개인정보 수집 관련 항목의 이력을 관리하는 데이터이며, 등록자에 관한 식별 가능 정보도 포함되어 있어 개방 대상에서 제외
  review_required: false
  review_comment: HIST 및 이력일련번호가 있어 이력 관리 목적이 중심이며, 등록자 식별정보도 일부 포함되므로 9호를 선정함.
- table_name: API KEY 관리
  category: API 인증 및 시스템 설정
  exclusion_code: '9'
  columns:
  - API 비밀번호명
  - API URL주소
  - API 값명
  - 시스템아이디
  - 등록자아이디
  exclusion_reason: >-
    API 비밀번호명, API URL주소, 시스템아이디 등 API 연계 및 설정에 관한 정보를 관리하는 시스템 관리용 데이터로, 등록자 식별정보도 포함되어 있어 개방에서 제외
  review_required: false
  review_comment: API 설정 및 연계정보를 관리하는 성격이 중심이므로 9호를 선정함. 비밀번호명만으로 실제 비밀번호 저장 여부를 단정하지 않음.
- table_name: QR코드 관리
  category: QR코드 생성 및 운영관리
  exclusion_code: '9'
  columns:
  - QR코드URL주소
  - 이미지경로명
  - QR코드명
  - 생성자아이디
  - 생성자IP주소
  exclusion_reason: >-
    QR코드URL주소, 이미지경로명, 생성자아이디 등 QR코드의 주소와 생성 정보를 기록하는 관리용 데이터로, 생성자와 연결될 수 있는 정보가 함께 포함되어 있어 개방에서 제외
  review_required: false
  review_comment: QR코드 관리정보가 주를 이루며 생성자 관련 식별 컬럼이 일부 포함되어 있어 9호를 선정함.
- table_name: 개인정보처리시스템관리
  category: 시스템 점검 및 후속 조치
  exclusion_code: '9'
  columns:
  - 계정점검1여부
  - 접속점검1여부
  - 이후조치1내용
  - 등록자명
  - 등록자IP주소
  exclusion_reason: >-
    계정점검1여부, 이후조치1내용 등 시스템 점검 및 후속 조치내용을 관리하는 내부 업무 데이터로, 등록자명 등 개인 식별 가능 정보도 함께 보관되어 개방에서 제외
  review_required: false
  review_comment: 계정·접속·다운로드 점검과 이후조치 관련 항목이 대부분이므로 9호를 선정함.
- table_name: 게시물 댓글 이력관리
  category: 댓글 변경 이력
  exclusion_code: '9'
  columns:
  - 이력일시
  - 이력유형명
  - 이력사용자아이디
  - 이력사용자명
  - 답변등록IP주소
  exclusion_reason: >-
    이력일시, 이력유형명, 이력사용자명 등 댓글의 처리 이력과 이력 사용자 정보를 함께 기록하고 있어 내부 이력 관리 및 개인정보 보호를 위해 개방에서 제외
  review_required: false
  review_comment: 댓글 내용뿐 아니라 이력 시점·유형·사용자 관련 항목이 있어 이력관리 테이블인 9호로 판단함.
- table_name: 게시판/콘텐츠 점검 이력
  category: 점검 이력 및 담당자 정보
  exclusion_code: '9'
  columns:
  - 점검일시
  - 점검유형명
  - 점검자아이디
  - 점검자명
  - 메뉴아이디
  exclusion_reason: >-
    게시판 및 콘텐츠의 점검 내역을 남기는 이력성 자료로, 점검일시, 점검유형명, 점검자명 등 점검 시점과 개인 식별 가능 항목을 포함하고 있어 개방에서 제외
  review_required: false
  review_comment: 점검 이력 기록이 주요 용도이며 점검자 식별정보가 함께 있어 9호를 선정함.
- table_name: 게시판 관리_이관용 테이블
  category: 이관용 게시판 설정정보
  exclusion_code: '9'
  columns:
  - 게시판아이디
  - 메뉴경로명
  - 파일제한크기
  - 등록자아이디
  - 등록자명
  exclusion_reason: >-
    게시판 데이터 이관을 위해 구분된 관리용 테이블로, 게시판아이디, 메뉴경로명, 등록자아이디 등 게시판 운영 설정과 등록자 정보를 함께 포함하고 있어 개방에서 제외
  review_required: false
  review_comment: 테이블명이 이관용임을 명시하고 게시판 운영 설정이 중심이므로 9호를 선정함.
- table_name: 게시물 파일관리
  category: 기존 시스템 연계 파일관리
  exclusion_code: '9'
  columns:
  - 구파일시퀀스
  - 구시스템아이디
  - 게시물파일경로명
  - DB타입
  - 파일명
  exclusion_reason: >-
    구파일시퀀스, 구시스템아이디, 게시물파일경로명 등 기존 시스템의 파일 식별정보와 첨부파일 경로를 함께 관리하는 데이터로, 시스템 연계 목적의 내부 관리정보이므로 개방에서 제외
  review_required: false
  review_comment: 구시스템 식별정보 및 파일경로가 있는 유형의 게시물 파일관리 예시이며, 이력이나 로그 데이터로 단정하지 않음.
- table_name: 게시물 파일관리_지원센터
  category: 지원센터 첨부파일 관리
  exclusion_code: '9'
  columns:
  - 파일경로
  - 다운로드URL
  - 썸네일 파일경로
  - 파일명
  - 게시물 번호
  exclusion_reason: >-
    파일경로, 다운로드URL, 썸네일 파일경로 등 지원센터 게시물의 첨부파일 연결과 다운로드 정보를 관리하는 테이블로, 파일 관리 목적의 시스템 운영정보를 고려하여 개방 대상에서 제외
  review_required: true
  review_comment: 파일 관리 목적을 근거로 9호를 후보로 검토함. 공개 게시물의 첨부파일인지 내부 파일정보인지는 컬럼명만으로 확인할 수 없어 추가 검토가 필요함.
- table_name: 게시판 권한관리
  category: 게시판 사용권한 설정
  exclusion_code: '9'
  columns:
  - 답변권한내용
  - 삭제권한내용
  - 열람권한내용
  - 등록권한내용
  - 관리권한내용
  exclusion_reason: >-
    답변권한내용, 삭제권한내용, 열람권한내용 등 게시판 기능별 사용 권한을 설정하는 정보로 구성되어 있어 시스템 권한 관리용 테이블로서 개방에서 제외
  review_required: false
  review_comment: 열람·등록·수정·삭제 등 권한 설정 항목이 중심이며 직접적인 개인 식별정보는 확인되지 않아 9호를 선정함.
- table_name: 게시판 관리
  category: 게시판 기능 및 운영 설정
  exclusion_code: '9'
  columns:
  - 게시판사용여부
  - 파일제한크기
  - 본인인증페이지값명
  - 비공개사용여부
  - 등록자아이디
  exclusion_reason: >-
    게시판 기능의 사용 조건을 설정하고 관리하는 목적의 테이블로, 파일제한크기, 비공개사용여부, 등록자아이디 등 운영 설정과 등록자 정보가 함께 포함되어 있어 개방에서 제외
  review_required: false
  review_comment: 기능 사용여부·운영 설정 관련 컬럼이 다수를 차지하므로 9호를 선정함.
- table_name: 게시판 추가항목관리
  category: 추가 입력항목 설정
  exclusion_code: '9'
  columns:
  - 추가컬럼명
  - 추가컬럼유형명
  - 필수여부
  - 추가컬럼정렬번호
  - 목록사용여부
  exclusion_reason: >-
    추가컬럼명, 추가컬럼유형명, 필수여부 등 게시판에서 사용하는 추가 항목의 구성과 입력 조건을 정하는 내부 설정용 자료이므로 개방 대상에서 제외
  review_required: false
  review_comment: 게시판에 추가하는 항목의 이름·형태·표시 및 필수 설정값이 중심이어서 9호를 선정함.
- table_name: 게시물 댓글관리
  category: 구시스템 연계 댓글관리
  exclusion_code: '9'
  columns:
  - 구게시판아이디
  - 구시스템아이디
  - 답변등록명
  - 답변내용
  - 시스템위치
  exclusion_reason: >-
    구게시판아이디, 구시스템아이디, 답변등록명 등 기존 시스템 식별값과 댓글 등록정보를 함께 보유한 운영 테이블로, 개인을 유추할 수 있는 작성자 정보도 포함되어 있어 개방에서 제외
  review_required: false
  review_comment: 구시스템 관련 식별값과 댓글 관리정보가 함께 존재하는 버전으로, 시스템 운영 목적이 중심이므로 9호를 선정함.
- table_name: 게시물 만족도 평가 관리
  category: 게시물별 의견 및 평가 관리
  exclusion_code: '9'
  columns:
  - 만족도의견내용
  - 만족도점수
  - 등록자아이디
  - 게시물일련번호
  exclusion_reason: >-
    만족도의견내용, 만족도점수, 등록자아이디 등 게시물 평가 의견과 등록자 정보를 연결하여 관리하는 내부 업무용 데이터로, 개인별 평가 내역을 유추할 가능성이 있어 개방에서 제외
  review_required: true
  review_comment: 게시물 평가 관리가 중심이므로 9호를 후보로 선정함. 의견 내용의 실제 개인정보 포함 여부에 따라 6호도 검토할 수 있음.
- table_name: 게시물 좋아요 관리
  category: 회원별 게시물 반응 기록
  exclusion_code: '9'
  columns:
  - 찬성일련번호
  - 회원아이디
  - 게시물일련번호
  - 게시판아이디
  exclusion_reason: >-
    게시물일련번호, 회원아이디, 찬성일련번호 등 회원별 게시물 추천 관계를 관리하는 데이터로, 회원 활동 내역과 연결되는 식별정보가 포함되어 있어 개방에서 제외
  review_required: true
  review_comment: 게시물 반응 관리정보가 중심이어서 9호로 분류했으나 회원별 이용 내역이 핵심인 경우 6호 적용도 검토해야 함.
- table_name: 공통상세코드관리
  category: 공통코드 세부 설정
  exclusion_code: '9'
  columns:
  - 공통상세코드
  - 공통상세코드정렬번호
  - 사용여부
  - 공통상세코드명
  exclusion_reason: >-
    공통상세코드, 공통상세코드정렬번호, 사용여부 등 시스템에서 활용하는 세부 코드값과 표시 순서를 관리하기 위한 원천 테이블로, 내부 코드 관리용 데이터이므로 개방에서 제외
  review_required: true
  review_comment: 시스템 코드 관리용으로 9호를 후보로 선정함. 코드값 자체는 공개 가능할 수 있어 비공개 필요성 검토가 필요함.
- table_name: 공휴일(대체휴일) 관리
  category: 일반 공개가능 정보와 관리번호 혼재
